<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflows Dashboard - Code Quest Campaign</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 30px;
        }

        .config-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .config-section h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tree {
            display: none;
        }

        .tree-node {
            margin: 8px 0;
        }

        .tree-node-content {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .tree-node-content:hover {
            background: #e9ecef;
            transform: translateX(4px);
        }

        .tree-node-content.active {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
        }

        .toggle-icon {
            margin-right: 12px;
            font-size: 18px;
            transition: transform 0.2s;
            width: 20px;
            text-align: center;
        }

        .toggle-icon.expanded {
            transform: rotate(90deg);
        }

        .node-icon {
            margin-right: 12px;
            font-size: 20px;
        }

        .node-label {
            flex: 1;
            font-weight: 600;
            color: #333;
        }

        .node-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
        }

        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-unknown {
            background: #e2e3e5;
            color: #383d41;
        }

        .tree-children {
            margin-left: 32px;
            display: none;
            border-left: 2px solid #e0e0e0;
            padding-left: 16px;
        }

        .tree-children.expanded {
            display: block;
        }

        .workflow-link {
            color: #667eea;
            text-decoration: none;
            font-size: 12px;
            margin-left: auto;
        }

        .workflow-link:hover {
            text-decoration: underline;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🚀 Workflows Dashboard</h1>
            <p>Interactive tree view for Code Quest Campaign pipelines</p>
        </div>

        <div class="content">
            <div class="config-section">
                <h3>📝 Configuration</h3>
                <div class="input-group">
                    <input type="text" id="owner" placeholder="GitHub Owner (e.g., FoushWare)" value="FoushWare">
                    <input type="text" id="repo" placeholder="Repository (e.g., code-quest-campign)" value="code-quest-campign">
                </div>
                <div class="input-group">
                    <input type="text" id="token" placeholder="GitHub Personal Access Token" type="password">
                </div>
                <button class="btn" onclick="loadWorkflows()">Load Workflows</button>
                <div class="error" id="error"></div>
            </div>

            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <p>Loading workflows...</p>
            </div>

            <div class="stats" id="stats" style="display: none;">
                <div class="stat-card">
                    <h3 id="total-workflows">0</h3>
                    <p>Total Workflows</p>
                </div>
                <div class="stat-card">
                    <h3 id="frontend-count">0</h3>
                    <p>Frontend</p>
                </div>
                <div class="stat-card">
                    <h3 id="backend-count">0</h3>
                    <p>Backend</p>
                </div>
                <div class="stat-card">
                    <h3 id="success-count">0</h3>
                    <p>Successful</p>
                </div>
            </div>

            <div class="tree" id="tree"></div>
        </div>
    </div>

    <script>
        let workflowsData = [];

        async function loadWorkflows() {
            const owner = document.getElementById('owner').value;
            const repo = document.getElementById('repo').value;
            const token = document.getElementById('token').value;
            const errorDiv = document.getElementById('error');
            const loadingDiv = document.getElementById('loading');
            const treeDiv = document.getElementById('tree');
            const statsDiv = document.getElementById('stats');

            errorDiv.style.display = 'none';
            loadingDiv.style.display = 'block';
            treeDiv.style.display = 'none';
            statsDiv.style.display = 'none';

            try {
                const headers = {};
                if (token) {
                    headers['Authorization'] = `token ${token}`;
                }

                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows`, {
                    headers: headers
                });

                if (!response.ok) {
                    throw new Error(`GitHub API error: ${response.status}`);
                }

                const data = await response.json();
                workflowsData = data.workflows || [];

                // Get recent runs for each workflow
                for (const workflow of workflowsData) {
                    try {
                        const runsResponse = await fetch(
                            `https://api.github.com/repos/${owner}/${repo}/actions/workflows/${workflow.id}/runs?per_page=1`,
                            { headers: headers }
                        );
                        const runsData = await runsResponse.json();
                        workflow.recentRun = runsData.workflow_runs?.[0] || null;
                    } catch (e) {
                        workflow.recentRun = null;
                    }
                }

                renderTree();
                updateStats();
                loadingDiv.style.display = 'none';
                treeDiv.style.display = 'block';
                statsDiv.style.display = 'grid';

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.style.display = 'block';
                loadingDiv.style.display = 'none';
            }
        }

        function renderTree() {
            const treeDiv = document.getElementById('tree');
            treeDiv.innerHTML = '';

            // Group workflows by team
            const groups = {
                'Frontend': [],
                'Backend CI': [],
                'Backend Deploy': [],
                'Other': []
            };

            workflowsData.forEach(workflow => {
                const name = workflow.name;
                let group = 'Other';

                if (name.startsWith('[Frontend]')) {
                    group = 'Frontend';
                } else if (name.startsWith('[Backend CI]')) {
                    group = 'Backend CI';
                } else if (name.startsWith('[Backend Deploy]')) {
                    group = 'Backend Deploy';
                }

                groups[group].push(workflow);
            });

            // Create tree structure
            const treeData = [
                {
                    label: 'Frontend Team',
                    icon: '🎨',
                    children: groups['Frontend'].map(w => ({
                        label: w.name.replace('[Frontend] ', ''),
                        icon: extractIcon(w.name),
                        workflow: w,
                        url: w.html_url
                    }))
                },
                {
                    label: 'Backend CI Team',
                    icon: '⚙️',
                    children: groups['Backend CI'].map(w => ({
                        label: w.name.replace('[Backend CI] ', ''),
                        icon: extractIcon(w.name),
                        workflow: w,
                        url: w.html_url
                    }))
                },
                {
                    label: 'Backend Deploy Team',
                    icon: '🚀',
                    children: groups['Backend Deploy'].map(w => ({
                        label: w.name.replace('[Backend Deploy] ', ''),
                        icon: extractIcon(w.name),
                        workflow: w,
                        url: w.html_url
                    }))
                }
            ];

            if (groups['Other'].length > 0) {
                treeData.push({
                    label: 'Other Workflows',
                    icon: '📋',
                    children: groups['Other'].map(w => ({
                        label: w.name,
                        icon: '📄',
                        workflow: w,
                        url: w.html_url
                    }))
                });
            }

            treeData.forEach(node => {
                treeDiv.appendChild(createTreeNode(node, 0));
            });
        }

        function extractIcon(name) {
            const iconMatch = name.match(/([\p{Emoji}])/u);
            return iconMatch ? iconMatch[1] : '📄';
        }

        function createTreeNode(node, level) {
            const nodeDiv = document.createElement('div');
            nodeDiv.className = 'tree-node';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'tree-node-content';
            contentDiv.style.paddingLeft = `${level * 16 + 16}px`;

            const hasChildren = node.children && node.children.length > 0;

            const toggleIcon = document.createElement('span');
            toggleIcon.className = 'toggle-icon';
            toggleIcon.textContent = hasChildren ? '▶' : '•';
            if (!hasChildren) toggleIcon.style.visibility = 'hidden';

            const nodeIcon = document.createElement('span');
            nodeIcon.className = 'node-icon';
            nodeIcon.textContent = node.icon;

            const label = document.createElement('span');
            label.className = 'node-label';
            label.textContent = node.label;

            contentDiv.appendChild(toggleIcon);
            contentDiv.appendChild(nodeIcon);
            contentDiv.appendChild(label);

            if (node.workflow) {
                const status = getStatus(node.workflow);
                const statusSpan = document.createElement('span');
                statusSpan.className = `node-status status-${status}`;
                statusSpan.textContent = status.toUpperCase();
                contentDiv.appendChild(statusSpan);

                const link = document.createElement('a');
                link.className = 'workflow-link';
                link.href = node.url;
                link.target = '_blank';
                link.textContent = 'View →';
                contentDiv.appendChild(link);
            }

            contentDiv.onclick = (e) => {
                if (hasChildren) {
                    e.stopPropagation();
                    const childrenDiv = nodeDiv.querySelector('.tree-children');
                    toggleIcon.classList.toggle('expanded');
                    childrenDiv.classList.toggle('expanded');
                }
                contentDiv.classList.toggle('active');
            };

            nodeDiv.appendChild(contentDiv);

            if (hasChildren) {
                const childrenDiv = document.createElement('div');
                childrenDiv.className = 'tree-children';
                node.children.forEach(child => {
                    childrenDiv.appendChild(createTreeNode(child, level + 1));
                });
                nodeDiv.appendChild(childrenDiv);
            }

            return nodeDiv;
        }

        function getStatus(workflow) {
            if (!workflow.recentRun) return 'unknown';
            const conclusion = workflow.recentRun.conclusion;
            if (conclusion === 'success') return 'success';
            if (conclusion === 'failure') return 'failed';
            if (conclusion === 'pending' || conclusion === 'in_progress') return 'pending';
            return 'unknown';
        }

        function updateStats() {
            const total = workflowsData.length;
            const frontend = workflowsData.filter(w => w.name.startsWith('[Frontend]')).length;
            const backend = workflowsData.filter(w => w.name.startsWith('[Backend')).length;
            const success = workflowsData.filter(w => getStatus(w) === 'success').length;

            document.getElementById('total-workflows').textContent = total;
            document.getElementById('frontend-count').textContent = frontend;
            document.getElementById('backend-count').textContent = backend;
            document.getElementById('success-count').textContent = success;
        }

        // Auto-load on page load if token is stored
        window.onload = () => {
            const savedToken = localStorage.getItem('github-token');
            if (savedToken) {
                document.getElementById('token').value = savedToken;
            }
        };

        // Save token when provided
        document.getElementById('token').addEventListener('change', (e) => {
            localStorage.setItem('github-token', e.target.value);
        });
    </script>
</body>
</html>
