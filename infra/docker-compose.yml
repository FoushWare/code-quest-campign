version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: codequest
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
      POSTGRES_DB: codequest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codequest"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    environment:
      PORT: 8081
      DATABASE_URL: postgres://codequest:${DB_PASSWORD:-dev_password}@postgres:5432/codequest?sslmode=disable
      REDIS_URL: redis://redis:6379
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  content-service:
    build:
      context: ..
      dockerfile: services/content/Dockerfile
    environment:
      PORT: 8082
      DATABASE_URL: postgres://codequest:${DB_PASSWORD:-dev_password}@postgres:5432/codequest?sslmode=disable
      REDIS_URL: redis://redis:6379
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gamification-service:
    build:
      context: ..
      dockerfile: services/gamification/Dockerfile
    environment:
      PORT: 8083
      REDIS_URL: redis://redis:6379
    ports:
      - "8083:8083"
    depends_on:
      redis:
        condition: service_healthy

  leaderboard-service:
    build:
      context: ..
      dockerfile: services/leaderboard/Dockerfile
    environment:
      PORT: 8084
      REDIS_URL: redis://redis:6379
    ports:
      - "8084:8084"
    depends_on:
      redis:
        condition: service_healthy

  spaced-repetition-service:
    build:
      context: ..
      dockerfile: services/spaced-repetition/Dockerfile
    environment:
      PORT: 8085
      DATABASE_URL: postgres://codequest:${DB_PASSWORD:-dev_password}@postgres:5432/codequest?sslmode=disable
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
