name: 🔐 CI - auth

on:
  pull_request:
    paths:
      - 'services/auth/**'
      - '.github/workflows/ci-auth.yml'
  push:
    branches:
      - main
    paths:
      - 'services/auth/**'
      - '.github/workflows/ci-auth.yml'

jobs:
  test:
    name: Auth Service Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run auth service tests
        run: cd services/auth && go test ./...
