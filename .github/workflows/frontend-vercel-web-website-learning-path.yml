name: [Frontend] 📚 Vercel - web-website-learning-path

on:
  pull_request:
    paths:
      - 'apps/web/website/learning-path/**'
      - '.github/workflows/frontend-vercel-web-website-learning-path.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/web/website/learning-path/**'
      - '.github/workflows/frontend-vercel-web-website-learning-path.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and deploy web-website-learning-path
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare runtime files
        run: npm run prepare:web-runtime:dev

      - name: Build app
        run: npm run build:web-website-learning-path

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: apps/web/website/learning-path
        run: vercel pull --yes --token=${{ secrets.VERCEL_TOKEN }} --environment=production

      - name: Deploy to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/web/website/learning-path
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
