name: Deploy Render - gamification

on:
  push:
    branches:
      - main
    paths:
      - 'services/gamification/**'
      - '.github/workflows/deploy-render-gamification.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Gamification Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: render-inc/render-deploy-action@v1.0.0
        with:
          service-id: srv-d8k8kkrtqb8s739226vg
          render-api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true
