name: Frontend Vercel

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web-shell
            app_dir: apps/web/shell
            build_script: build:web-shell
            project_name: shell
          - app: web-website
            app_dir: apps/web/website
            build_script: build:web-website
            project_name: website
          - app: web-admin
            app_dir: apps/web/admin
            build_script: build:web-admin
            project_name: admin
          - app: web-website-learning-path
            app_dir: apps/web/website/learning-path
            build_script: build:web-website-learning-path
            project_name: learning-path
          - app: web-website-lessons
            app_dir: apps/web/website/lessons
            build_script: build:web-website-lessons
            project_name: lessons
          - app: web-website-hearts-gems
            app_dir: apps/web/website/hearts-gems
            build_script: build:web-website-hearts-gems
            project_name: hearts-gems
          - app: web-website-league-social
            app_dir: apps/web/website/league-social
            build_script: build:web-website-league-social
            project_name: league-social
          - app: web-website-profile-settings
            app_dir: apps/web/website/profile-settings
            build_script: build:web-website-profile-settings
            project_name: profile-settings
          - app: web-admin-users
            app_dir: apps/web/admin/users
            build_script: build:web-admin-users
            project_name: users
          - app: web-admin-moderation
            app_dir: apps/web/admin/moderation
            build_script: build:web-admin-moderation
            project_name: moderation
          - app: web-admin-analytics
            app_dir: apps/web/admin/analytics
            build_script: build:web-admin-analytics
            project_name: analytics
          - app: web-admin-content-editor
            app_dir: apps/web/admin/content-editor
            build_script: build:web-admin-content-editor
            project_name: content-editor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare runtime files
        run: npm run prepare:web-runtime:dev

      - name: Build app
        run: npm run ${{ matrix.build_script }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        working-directory: ${{ matrix.app_dir }}
        run: vercel pull --yes --token=${{ secrets.VERCEL_TOKEN }} --environment=production

      - name: Build Project Artifacts
        working-directory: ${{ matrix.app_dir }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ matrix.app_dir }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
