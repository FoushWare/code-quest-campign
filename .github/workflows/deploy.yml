name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-web:
    name: Deploy web microfrontends to Vercel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - website
          - admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app bundle
        run: npm run build:web-${{ matrix.app }}

      - name: Deploy to Vercel
        run: npx vercel deploy dist/apps/web/${{ matrix.app }} --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-services:
    name: Build service images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build service images
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/code-quest-auth:latest -f services/auth/Dockerfile .
          docker build -t ghcr.io/${{ github.repository_owner }}/code-quest-content:latest -f services/content/Dockerfile .
          docker build -t ghcr.io/${{ github.repository_owner }}/code-quest-gamification:latest -f services/gamification/Dockerfile .
          docker build -t ghcr.io/${{ github.repository_owner }}/code-quest-leaderboard:latest -f services/leaderboard/Dockerfile .
          docker build -t ghcr.io/${{ github.repository_owner }}/code-quest-spaced-repetition:latest -f services/spaced-repetition/Dockerfile .

      - name: Push service images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/code-quest-auth:latest
          docker push ghcr.io/${{ github.repository_owner }}/code-quest-content:latest
          docker push ghcr.io/${{ github.repository_owner }}/code-quest-gamification:latest
          docker push ghcr.io/${{ github.repository_owner }}/code-quest-leaderboard:latest
          docker push ghcr.io/${{ github.repository_owner }}/code-quest-spaced-repetition:latest
