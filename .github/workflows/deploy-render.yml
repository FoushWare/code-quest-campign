name: Deploy to Render

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - '.github/workflows/deploy-render.yml'
  workflow_dispatch:

jobs:
  deploy-auth:
    name: Deploy Auth Service
    runs-on: ubuntu-latest
    if: contains(github.event.commits[0].modified, 'services/auth') || contains(github.event.commits[0].added, 'services/auth') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: render-inc/render-deploy-action@v1.0.0
        with:
          service-id: srv-d8iualojo6nc73do18j0
          render-api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true

  deploy-content:
    name: Deploy Content Service
    runs-on: ubuntu-latest
    if: contains(github.event.commits[0].modified, 'services/content') || contains(github.event.commits[0].added, 'services/content') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: render-inc/render-deploy-action@v1.0.0
        with:
          service-id: srv-d8k8kkvlk1mc73cl7bs0
          render-api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true

  deploy-gamification:
