    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: render-inc/render-deploy-action@v1.0.0
        with:
          service-id: srv-d8k8klf7f7vs73c2uidg
          render-api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true
