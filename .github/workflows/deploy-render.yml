    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: render-inc/render-deploy-action@v1.0.0
        with:
          service-id: srv-d8k8kkrtqb8s739226vg
          render-api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true

  deploy-leaderboard:
    name: Deploy Leaderboard Service
    runs-on: ubuntu-latest
    if: contains(github.event.commits[0].modified, 'services/leaderboard') || contains(github.event.commits[0].added, 'services/leaderboard') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: render-inc/render-deploy-action@v1.0.0
        with:
          service-id: srv-d8k8kl1o3t8c73aq5cfg
