name: 🚀 Deploy Render - leaderboard

on:
  push:
    branches:
      - main
    paths:
      - 'services/leaderboard/**'
      - '.github/workflows/deploy-render-leaderboard.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Leaderboard Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Render
        uses: render-inc/render-deploy-action@v1.0.0
        with:
          service-id: srv-d8k8kl1o3t8c73aq5cfg
          render-api-key: ${{ secrets.RENDER_API_KEY }}
          wait-for-success: true
